# ==========================================
# PRODUCTION PROFILE (Railway/Docker/Kubernetes)
# ==========================================

# =========================
# DATABASE - DEDICATED FOR EXAM SERVICE
# =========================
spring.datasource.url=jdbc:mysql://${MYSQLHOST:mysql-exam}:${MYSQLPORT:3306}/${MYSQLDATABASE:examservicedb}?useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD}

# =========================
# SERVER
# =========================
server.port=${PORT:8084}

# =========================
# EUREKA - ENABLED
# =========================
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka-server:8761/eureka/}

eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${SERVICE_NAME:exam-service}
eureka.instance.non-secure-port=8084
eureka.instance.instance-id=${eureka.instance.hostname}:${server.port}

# =========================
# SERVICE URLS
# =========================
quiz-service.base-url=${QUIZ_SERVICE_BASE_URL:http://quiz-service}

# =========================
# LOGGING - INFO
# =========================
logging.level.com.example.examService=INFO
logging.level.org.springframework.web=INFO

# =========================
# JPA - HIDE SQL
# =========================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
