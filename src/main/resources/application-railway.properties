# Railway-specific configuration for examService

# Eureka Instance Configuration
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:examservice-production-7afe.up.railway.app}
eureka.instance.non-secure-port=${EUREKA_INSTANCE_NON_SECURE_PORT:8083}
eureka.instance.instance-id=${eureka.instance.hostname}:${spring.application.name}:${eureka.instance.non-secure-port}
