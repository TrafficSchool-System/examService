spring.application.name=exam-service

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

#Server Port (Skiljer sig från övriga mikrotjänster)
server.port=${SERVER_PORT:8084}

#Database config - ExamService databas
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/examservicedb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.pool-name=ExamServiceHikariPool

#JPA config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

#Logging
spring.output.ansi.enabled=ALWAYS
logging.level.org.hibernate.SQL=DEBUG

#Svensk tid
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Stockholm
spring.jackson.time-zone=Europe/Stockholm
spring.jackson.date-format=yyyy-MM-dd HH:mm

# JWT Configuration - REFACTORED
# ExamService läser INTE JWT tokens längre!
# Gateway validerar JWT och sätter X-User-Id, X-User-Email, X-User-Role headers
# ExamService läser dessa headers via GatewayHeaderAuthenticationFilter

# Actuator Configuration (Health checks & Monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always