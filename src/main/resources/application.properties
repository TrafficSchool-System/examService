# ==========================================
# SHARED CONFIGURATION (ALL ENVIRONMENTS)
# ==========================================

# =========================
# APPLICATION
# =========================
spring.application.name=exam-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# =========================
# DATABASE - SHARED CONFIG
# =========================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.pool-name=ExamServiceHikariPool

# =========================
# JPA/HIBERNATE - SHARED CONFIG
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Timezone - UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# =========================
# LOGGING - SHARED PATTERN
# =========================
spring.output.ansi.enabled=ALWAYS

# Actuator Configuration (Health checks & Monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Service-to-Service Communication
service.api.key=${SERVICE_API_KEY:TrafficSchool-Internal-Key-2026-CHANGE-IN-PROD}
quiz.service.url=${QUIZ_SERVICE_URL:http://localhost:8085}