# ==========================================
# LOCAL DEVELOPMENT PROFILE
# ==========================================

# =========================
# DATABASE - DEDICATED FOR EXAM SERVICE
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/examservicedb
spring.datasource.username=root
spring.datasource.password=

# =========================
# SERVER
# =========================
server.port=8084

# =========================
# EUREKA - ENABLED (Gateway använder lb://)
# =========================
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =========================
# SERVICE URLS - DIRECT HTTP
# =========================
quiz-service.base-url=${QUIZ_SERVICE_BASE_URL:http://localhost:8085}

# =========================
# LOGGING
# =========================
# Log levels are configured in logback-spring.xml (profile-aware)
# Uncomment below only to temporarily override a specific logger
# logging.level.com.example.examService=TRACE
